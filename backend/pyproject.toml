[tool.poetry]
name = "rag-backend"
version = "0.1.0"
description = "基于 LangChain + Milvus 的垂直领域智能文档问答系统后端"
authors = []
license = "MIT"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.34.0" }
langchain = "^0.3.0"
langchain-community = "^0.3.0"
langchain-openai = "^0.3.0"
langchain-milvus = "^0.1.0"
pymilvus = ">=2.5.5,<2.6.0"
langchain-text-splitters = "^0.3.0"
langgraph = ">=1.0"  # 实际经 pip 安装（langchain-core 漂移导致 poetry 解析冲突）
pymupdf4llm = "^0.0.17"
python-docx = "^1.1.0"
docx2txt = "^0.9.0"
openpyxl = "^3.1.0"
python-pptx = "^1.0.0"
beautifulsoup4 = "^4.12.0"
rank-bm25 = "^0.2.2"
jieba = "^0.42.1"
python-multipart = "^0.0.20"
pydantic-settings = "^2.7.0"
pypdf = "^5.0.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.9.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
